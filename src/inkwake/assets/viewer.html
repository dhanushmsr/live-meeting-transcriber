<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ink report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --bg:#f6f7fb; --paper:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --soft:#eff6ff;
            --ok:#16a34a; --warn:#b45309; --violet:#6d28d9; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif;
           font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased; }
    .topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
              border-bottom:1px solid var(--line); padding:10px 20px; display:flex; align-items:center;
              justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .brand { font-weight:700; display:flex; gap:8px; align-items:center; }
    .brand-badge { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; padding:2px 8px; border-radius:6px; font-size:11px; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { display:inline-flex; gap:6px; align-items:center; font:inherit; font-size:13px; font-weight:500; padding:7px 13px;
           border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer; }
    .btn:hover { background:#f8fafc; border-color:#cbd5e1; }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn-primary:hover { background:#1d4ed8; }
    .btn[disabled] { opacity:.6; cursor:default; }
    .expiry { background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-size:12px; font-weight:600; padding:4px 11px; border-radius:20px; }

    .wrap { max-width:820px; margin:28px auto 90px; padding:0 14px; }
    .page { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:44px 52px;
            box-shadow:0 4px 22px -4px rgba(15,23,42,.06); }
    h1.title { font-size:32px; line-height:1.2; letter-spacing:-.02em; margin:0 0 8px; }
    .facts { color:var(--muted); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:22px; }
    .facts span + span::before { content:"\00b7"; margin-right:14px; }

    .brief { background:var(--soft); border-left:5px solid var(--accent); border-radius:0 12px 12px 0; padding:16px 22px; margin:6px 0 26px; }
    .label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
    .brief p { margin:4px 0 0; font-size:19px; line-height:1.5; font-weight:500; }

    h2 { font-size:15px; letter-spacing:.02em; margin:32px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line); color:#1e293b; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:6px; }
    .two h2 { margin-top:0; }
    @media (max-width:760px){ .two { grid-template-columns:1fr; } .page { padding:26px 20px; border-radius:0; } h1.title{font-size:25px;} }

    ul.clean { list-style:none; padding:0; margin:0; }
    ul.clean li { position:relative; padding:5px 0 5px 26px; }
    ul.clean li::before { content:"\2713"; position:absolute; left:0; color:var(--ok); font-weight:700; }
    ul.dots li::before { content:"\2022"; color:var(--accent); font-size:20px; line-height:1.2; }
    ul.q li::before { content:"?"; color:var(--warn); font-weight:700; }

    .task { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
    .task:last-child { border-bottom:none; }
    .task input { margin-top:6px; width:17px; height:17px; cursor:pointer; accent-color:var(--accent); }
    .task .what { flex:1; }
    .chip { display:inline-block; font-size:12px; font-weight:600; padding:1px 9px; border-radius:20px; background:#e2e8f0; color:#334155; margin-right:6px; }
    .chip.due { background:#fef3c7; color:#92400e; }

    .tl { display:flex; gap:14px; padding:8px 0; border-bottom:1px dashed var(--line); }
    .tl:last-child { border-bottom:none; }
    .time { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); background:#f1f5f9; border-radius:6px; padding:2px 8px; height:fit-content; white-space:nowrap; }
    .tl b { display:block; }
    .tl small { color:#475569; font-size:14px; }
    .hl { display:flex; gap:10px; padding:9px 14px; border-radius:8px; margin-bottom:8px; background:#fffbeb; border:1px solid #fde68a; font-size:15px; }
    .hl.me { background:#f5f3ff; border-color:#ddd6fe; }
    .hl b { white-space:nowrap; }

    .bar { display:flex; height:14px; border-radius:7px; overflow:hidden; background:#e2e8f0; margin:12px 0; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

    .email { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .email .subj { padding:10px 16px; background:#f8fafc; font-weight:600; border-bottom:1px solid var(--line); font-size:15px; }
    .email pre { margin:0; padding:14px 16px; white-space:pre-wrap; font-family:inherit; font-size:15px; color:#334155; }
    .email .row { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; background:#fafafa; }

    .ask { border:1px solid #bfdbfe; background:var(--soft); border-radius:12px; padding:18px 20px; margin-top:30px; }
    .ask .row { display:flex; gap:8px; margin-top:10px; }
    .ask input { flex:1; padding:9px 14px; border:1px solid #bfdbfe; border-radius:8px; font:inherit; font-size:15px; }
    .ask .q { margin-top:14px; font-weight:600; }
    .ask .a { margin-top:4px; white-space:pre-wrap; color:#1e293b; }

    details.tr { margin-top:30px; border:1px solid var(--line); border-radius:12px; padding:0 18px; }
    details.tr summary { cursor:pointer; padding:14px 0; font-weight:600; font-size:15px; }
    .search { width:100%; padding:9px 14px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:15px; margin:2px 0 8px; }
    .turn { padding:9px 0; border-bottom:1px dashed var(--line); font-size:15px; }
    .turn.me { background:#f5f3ff; margin:0 -10px; padding:9px 10px; border-radius:6px; }
    .who { font-weight:700; color:var(--accent); margin:0 6px 0 8px; }
    .tag { font-size:11px; font-weight:700; color:var(--violet); background:#ede9fe; padding:1px 7px; border-radius:10px; margin-right:6px; }
    .en { margin:2px 0 0 62px; color:#64748b; font-style:italic; font-size:14px; }
    .en b { font-style:normal; }

    .toast { position:fixed; right:22px; bottom:22px; background:#0f172a; color:#fff; padding:11px 18px; border-radius:8px; font-size:14px; display:none; z-index:100; }
    .loading { text-align:center; color:var(--muted); padding:90px 0; }
    .gone { max-width:440px; margin:18vh auto 0; text-align:center; background:#fff; border:1px solid var(--line); border-radius:16px; padding:40px 30px; }
    .gone h1 { font-size:22px; margin:0 0 10px; } .gone p { color:var(--muted); margin:0; font-size:15px; }
    @media print { .topbar, .toast, .ask, .search { display:none !important; } body { background:#fff; } .page { border:none; box-shadow:none; padding:0; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>Ink</span><span class="brand-badge">Meeting brief</span></div>
    <div class="actions">
      <span class="expiry" id="timerTag" title="This link deletes itself after 72 hours"><span id="countdownText">Loading...</span></span>
      <button class="btn" data-act="shareReport">Share link</button>
      <button class="btn" data-act="exportDocx">Export DOCX</button>
      <button class="btn" data-act="exportMarkdown">Markdown</button>
      <button class="btn btn-primary" data-act="exportPdf">Export PDF</button>
    </div>
  </header>
  <main class="wrap"><article class="page" id="reportContent"><div class="loading">Loading report...</div></article></main>
  <div class="toast" id="toast"></div>

<script>
let reportData = null;

// ---------- tiny safe DOM helpers: all report text goes through textContent, never innerHTML ----------
function h(tag, cls, text, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (style) e.style.cssText = style; return e; }
function add(parent, ...kids) { kids.forEach(k => k && parent.appendChild(k)); return parent; }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => { t.style.display = "none"; }, 3200); }

// ---------- shared text logic (mirrors report.py) ----------
function stamp(t) { t = Math.floor(Number(t) || 0); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
function norm(s) { return (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); }
function similar(a, b) { const wa = new Set(norm(a).split(" ").filter(Boolean)), wb = new Set(norm(b).split(" ").filter(Boolean)); if (!wa.size || !wb.size) return wa.size === wb.size;
  let c = 0; wa.forEach(w => { if (wb.has(w)) c++; }); return c / Math.max(wa.size, wb.size) >= 0.8; }
function firstSentence(t) { t = (t || "").trim(); const m = t.match(/^[\s\S]+?[.!?](\s|$)/); const out = m ? m[0].trim() : t; return out.length > 220 ? out.slice(0, 217) + "..." : out; }
function mergeTranscript(lines, gap) {
  gap = gap || 8; const out = [];
  [...(lines || [])].sort((a, b) => (a.t || 0) - (b.t || 0)).forEach(x => {
    const text = (x.text || "").trim(), tr = (x.translation || "").trim(); if (!text && !tr) return;
    const prev = out[out.length - 1];
    if (prev && prev.speaker === x.speaker && (x.t || 0) - prev.last <= gap) {
      prev.text = (prev.text + " " + text).trim(); prev.translation = (prev.translation + " " + tr).trim(); prev.last = x.t || 0; prev.mention = prev.mention || !!x.mention;
    } else out.push({ t: x.t || 0, last: x.t || 0, speaker: x.speaker || "Speaker", text, translation: tr, mention: !!x.mention });
  });
  out.forEach(m => { if (!m.text) { m.text = m.translation; m.translation = ""; } else if (similar(m.text, m.translation)) m.translation = ""; });
  return out;
}
function talkTotals() { const o = {}; for (const [s, per] of Object.entries(reportData.talk || {})) { const v = Object.values(per).reduce((a, b) => a + (Number(b) || 0), 0); if (v > 0) o[s] = v; } return o; }
function realSpeakers(tot) { const names = Object.keys(tot); const named = names.filter(n => n.toLowerCase() !== "others"); return names.length >= 2 && named.length >= 1 ? tot : {}; }
function bookmarkText(b) {
  if (b.text) return b.text;
  const tr = reportData.transcript || []; if (!tr.length) return "";
  const near = tr.reduce((p, c) => Math.abs((c.t || 0) - b.t) < Math.abs((p.t || 0) - b.t) ? c : p);
  return Math.abs((near.t || 0) - b.t) <= 30 ? (near.translation || near.text || "").slice(0, 160) : "";
}
function prettyWhen() { return reportData.started_at ? new Date(reportData.started_at).toLocaleString("en-US", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; }
function people() {
  const host = (reportData.host_name || "").toLowerCase();
  const all = [...(reportData.participants || []), ...Object.keys(reportData.talk || {})];
  return [...new Set(all)].filter(n => !["others", "you"].includes(n.toLowerCase()) && (!host || !n.toLowerCase().includes(host)));
}

// ---------- how this page gets its data ----------
// Ink's web server (local or cloud) needs nothing special: the defaults below talk to /api. The browser extension
// supplies window.INK (before this script runs) to read reports from the browser's storage instead.
const INK = window.INK || {};
const reportId = () => (INK.reportId ? INK.reportId() : location.pathname.split("/").filter(Boolean).pop() || "");
async function loadReport(id) {
  if (INK.load) return INK.load(id);
  const r = await fetch("/api/report/" + encodeURIComponent(id), { cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function canAsk() {
  if (INK.canAsk) return INK.canAsk();
  try { return (await (await fetch("/api/capabilities", { cache: "no-store" })).json()).ask === true; } catch (e) { return false; }   // cloud: not offered
}
async function askMeeting(id, question) {
  if (INK.ask) return INK.ask(id, question);
  const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, question }) });
  const j = await r.json();
  return j.answer || j.error || "No answer";
}

// ---------- load ----------
document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => window[b.dataset.act]()));
(async function load() {
  try {
    const data = await loadReport(reportId());
    if (!data) return showGone();
    reportData = data; render();
  } catch (e) { const root = document.getElementById("reportContent"); root.textContent = ""; add(root, h("div", "loading", "Could not load this report: " + e.message)); }
})();

function showGone() {
  document.title = "Report expired - Ink"; document.querySelector(".actions").style.display = "none";
  const main = document.querySelector("main"); main.textContent = "";
  add(main, add(h("div", "gone"), h("h1", null, "Meeting report expired"), h("p", null, "This link reached its 72-hour lifespan and was permanently deleted, or the link is not valid.")));
}
function startCountdown() {
  const end = new Date(reportData.expires_at || (Date.now() + 72 * 3600 * 1000));
  const tick = () => { const d = end - new Date(), tag = document.getElementById("timerTag");
    if (d <= 0) { document.getElementById("countdownText").textContent = "Link expired"; tag.style.background = "#fee2e2"; tag.style.color = "#991b1b"; return; }
    document.getElementById("countdownText").textContent = "Deletes in " + Math.floor(d / 3600000) + "h " + Math.floor((d % 3600000) / 60000) + "m"; };
  tick(); setInterval(tick, 60000);
}

// ---------- the report ----------
const COLORS = ["#2563eb", "#16a34a", "#f59e0b", "#dc2626", "#7c3aed", "#0891b2"];
function section(root, title) { return root.appendChild(h("h2", null, title)); }
function list(items, cls) { const ul = h("ul", "clean " + (cls || "")); items.forEach(x => ul.appendChild(h("li", null, String(x)))); return ul; }

function render() {
  const d = reportData, a = d.analysis || {};
  const heading = d.title && d.title !== "Meeting Report" ? d.title : (a.title || "Meeting report");
  document.title = heading + " - Ink";
  const root = document.getElementById("reportContent"); root.textContent = "";

  add(root, h("h1", "title", heading));
  const when = prettyWhen();
  const mins = Number(d.duration_minutes) || 0;
  const facts = h("div", "facts");
  [when, mins >= 1 ? Math.round(mins) + " min" : Math.round(mins * 60) + " sec", d.platform, people().length ? "with " + people().slice(0, 6).join(", ") : "", a.sentiment ? "tone: " + String(a.sentiment).toLowerCase() : ""]
    .filter(Boolean).forEach(f => facts.appendChild(h("span", null, f)));
  add(root, facts);

  const tldr = (a.tldr || firstSentence(a.summary)).trim();
  if (tldr) add(root, add(h("div", "brief"), h("div", "label", "In short"), h("p", null, tldr)));

  const decisions = a.decisions || [], actions = a.action_items || [];
  if (decisions.length || actions.length) {
    const grid = h("div", decisions.length && actions.length ? "two" : "");
    if (decisions.length) add(grid, add(h("div"), h("h2", null, "Decisions"), list(decisions)));
    if (actions.length) {
      const box = add(h("div"), h("h2", null, "Action items"));
      actions.forEach(i => {
        const cb = h("input"); cb.type = "checkbox";
        const what = add(h("div", "what"), h("span", null, i.task || ""));
        const meta = h("div", null, null, "margin-top:3px");
        meta.appendChild(h("span", "chip", i.owner || "Unassigned"));
        if (i.due) meta.appendChild(h("span", "chip due", i.due));
        what.appendChild(meta);
        box.appendChild(add(h("div", "task"), cb, what));
      });
      grid.appendChild(box);
    }
    root.appendChild(grid);
  }

  if (a.summary && tldr && norm(a.summary) !== norm(tldr)) { section(root, "Context"); add(root, h("p", null, a.summary, "margin:0")); }
  const take = a.takeaways || a.key_points || [];
  if (take.length) { section(root, "Worth remembering"); add(root, list(take, "dots")); }
  if ((a.open_questions || []).length) { section(root, "Still open"); add(root, list(a.open_questions, "q")); }

  if ((a.chapters || []).length) {
    section(root, "Timeline");
    a.chapters.forEach(c => add(root, add(h("div", "tl"), h("span", "time", c.start || ""), add(h("div"), h("b", null, c.title || ""), h("small", null, c.summary || "")))));
  }

  const marks = d.bookmarks || [], mentioned = (d.transcript || []).filter(l => l.mention);
  if (marks.length || mentioned.length) {
    section(root, "Highlights");
    marks.forEach(b => add(root, add(h("div", "hl"), h("b", null, "★ " + stamp(b.t)), h("span", null, bookmarkText(b) || "You bookmarked this moment."))));
    mentioned.forEach(l => add(root, add(h("div", "hl me"), h("b", null, "@ " + stamp(l.t)), h("span", null, (l.speaker || "Someone") + " mentioned you: " + (l.translation || l.text || "")))));
  }

  const tot = realSpeakers(talkTotals()), whole = Object.values(tot).reduce((x, y) => x + y, 0) || 1;
  if (Object.keys(tot).length) {
    section(root, "Who spoke");
    const bar = h("div", "bar"), legend = h("div", "legend");
    Object.entries(tot).sort((x, y) => y[1] - x[1]).forEach(([s, v], i) => {
      const color = COLORS[i % COLORS.length];
      const seg = h("div", null, null, "width:" + (v / whole * 100).toFixed(1) + "%;background:" + color); seg.title = s; bar.appendChild(seg);
      const li = h("span"); add(li, h("span", "dot", null, "background:" + color), document.createTextNode(s + " "), h("b", null, Math.round(v / whole * 100) + "%"), document.createTextNode(" (" + (v / 60).toFixed(1) + " min)"));
      legend.appendChild(li);
    });
    add(root, bar, legend);
  }

  const email = a.follow_up_email || {};
  if (email.body) {
    section(root, "Follow-up email (draft)");
    const row = h("div", "row");
    const mk = (label, fn) => { const b = h("button", "btn", label); b.onclick = fn; return b; };
    row.appendChild(mk("Copy", async () => { try { await navigator.clipboard.writeText("Subject: " + (email.subject || "") + "\n\n" + email.body); showToast("Email copied"); } catch (e) { showToast("Select the text and copy it"); } }));
    row.appendChild(mk("Open in email app", () => { location.href = "mailto:?subject=" + encodeURIComponent(email.subject || "") + "&body=" + encodeURIComponent(email.body); }));
    row.appendChild(mk("Send via WhatsApp", () => { window.open("https://wa.me/?text=" + encodeURIComponent((email.subject ? email.subject + "\n\n" : "") + email.body), "_blank", "noopener"); }));
    add(root, add(h("div", "email"), h("div", "subj", email.subject || "(no subject)"), h("pre", null, email.body), row));
  }

  const slot = h("div"); slot.id = "askSlot"; root.appendChild(slot);

  const turns = mergeTranscript(d.transcript);
  if (turns.length) {
    const det = h("details", "tr"); det.id = "transcript";
    det.appendChild(h("summary", null, "Full transcript (" + turns.length + " turns) – click to open"));
    const search = h("input", "search"); search.type = "search"; search.placeholder = "Search the transcript..."; det.appendChild(search);
    const langs = (d.languages || []).filter(Boolean);
    if (langs.length > 1) det.appendChild(h("p", null, "Languages heard: " + langs.join(", ") + ". English appears under lines spoken in another language.", "font-size:13px;color:#64748b;margin:4px 0 6px"));
    const rows = [];
    turns.forEach(m => {
      const wrap = h("div", "turn" + (m.mention ? " me" : ""));
      const line = add(h("div"), h("span", "time", stamp(m.t)), h("span", "who", m.speaker));
      if (m.mention) line.appendChild(h("span", "tag", "@you"));
      line.appendChild(document.createTextNode(m.text));
      wrap.appendChild(line);
      if (m.translation) wrap.appendChild(add(h("div", "en"), h("b", null, "In English: "), document.createTextNode(m.translation)));
      rows.push([wrap, (m.speaker + " " + m.text + " " + m.translation).toLowerCase()]); det.appendChild(wrap);
    });
    search.addEventListener("input", () => { const q = search.value.trim().toLowerCase(); if (q) det.open = true; rows.forEach(([r, t]) => { r.style.display = !q || t.includes(q) ? "" : "none"; }); });
    root.appendChild(det);
  }
  startCountdown(); initAsk();
}

// ---------- ask this meeting (only where the server can answer: Ink's local server) ----------
async function initAsk() {
  const ok = await canAsk();
  const slot = document.getElementById("askSlot"); if (!ok || !slot) return;
  const input = h("input"); input.type = "text"; input.maxLength = 500; input.placeholder = "e.g. What did we decide about pricing? Who owns the release notes?";
  const btn = h("button", "btn btn-primary", "Ask"), out = h("div");
  const send = async () => {
    const q = input.value.trim(); if (!q) return;
    btn.disabled = true; btn.textContent = "Thinking...";
    const qEl = h("div", "q", q), aEl = h("div", "a", "..."); out.prepend(aEl); out.prepend(qEl);
    try {
      aEl.textContent = await askMeeting(reportId(), q);
    } catch (e) { aEl.textContent = "Could not get an answer: " + e.message; }
    btn.disabled = false; btn.textContent = "Ask"; input.value = "";
  };
  btn.onclick = send; input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  add(slot, add(h("div", "ask"), h("div", "label", "Ask about this meeting"), h("div", null, "Answers come only from this meeting's transcript.", "font-size:14px;color:#475569"), add(h("div", "row"), input, btn), out));
}

async function shareReport() {
  if (INK.share) {   // the extension has no public address of its own: sharing uploads this one report on request
    try { showToast("Creating the link..."); const link = await INK.share(reportData); await navigator.clipboard.writeText(link); showToast("Public link copied. It works for 72 hours."); }
    catch (e) { showToast(String(e.message || e)); }
    return;
  }
  const url = location.href, t = (reportData && reportData.title) || "Meeting report";
  if (navigator.share) { try { await navigator.share({ title: t, text: t + " - meeting brief", url }); return; } catch (e) { /* cancelled */ } }
  try { await navigator.clipboard.writeText(url); showToast("Link copied. Paste it into WhatsApp, Gmail or anywhere."); } catch (e) { showToast("Copy this address: " + url); }
}

// ---------- exports ----------
function safeName() { return (reportData.title && reportData.title !== "Meeting Report" ? reportData.title : (reportData.analysis || {}).title || "Meeting_Report").replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "Meeting_Report"; }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function heading() { return reportData.title && reportData.title !== "Meeting Report" ? reportData.title : ((reportData.analysis || {}).title || "Meeting report"); }
function briefText() { const a = reportData.analysis || {}; return (a.tldr || firstSentence(a.summary)).trim(); }

async function exportPdf() {
  const el = document.getElementById("reportContent");
  if (!window.html2pdf) { window.print(); return; }
  const det = document.getElementById("transcript"), wasOpen = det ? det.open : false;
  if (det) det.open = true;                       // the transcript must be in the PDF even if it is collapsed on screen
  try {
    showToast("Preparing PDF...");
    await html2pdf().set({ margin: [10, 10, 10, 10], filename: safeName() + ".pdf", image: { type: "jpeg", quality: 0.96 }, html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }, pagebreak: { mode: ["css", "legacy"], avoid: [".task", ".tl", ".turn", ".hl", ".brief"] } }).from(el).save();
    showToast("PDF downloaded");
  } catch (err) { console.error("PDF export error:", err); window.print(); }
  finally { if (det) det.open = wasOpen; }
}

function exportMarkdown() {
  const d = reportData, a = d.analysis || {}, L = [];
  L.push("# " + heading(), "");
  const facts = [prettyWhen(), (Number(d.duration_minutes) || 0).toFixed(0) + " min", d.platform, people().length ? "with " + people().join(", ") : ""].filter(Boolean);
  L.push("_" + facts.join(" · ") + "_", "");
  if (briefText()) L.push("> **In short:** " + briefText(), "");
  if ((a.decisions || []).length) { L.push("## Decisions", ""); a.decisions.forEach(x => L.push("- ✓ " + x)); L.push(""); }
  if ((a.action_items || []).length) { L.push("## Action items", ""); a.action_items.forEach(i => L.push("- [ ] " + i.task + (i.owner ? " (" + i.owner + ")" : "") + (i.due ? " – " + i.due : ""))); L.push(""); }
  if (a.summary && norm(a.summary) !== norm(briefText())) L.push("## Context", "", a.summary, "");
  const take = a.takeaways || a.key_points || [];
  if (take.length) { L.push("## Worth remembering", ""); take.forEach(x => L.push("- " + x)); L.push(""); }
  if ((a.open_questions || []).length) { L.push("## Still open", ""); a.open_questions.forEach(x => L.push("- " + x)); L.push(""); }
  if ((a.chapters || []).length) { L.push("## Timeline", ""); a.chapters.forEach(c => L.push("- **" + (c.start || "") + "** " + (c.title || "") + (c.summary ? " – " + c.summary : ""))); L.push(""); }
  const marks = d.bookmarks || [], men = (d.transcript || []).filter(l => l.mention);
  if (marks.length || men.length) { L.push("## Highlights", ""); marks.forEach(b => L.push("- ★ [" + stamp(b.t) + "] " + (bookmarkText(b) || "Bookmarked"))); men.forEach(l => L.push("- @ [" + stamp(l.t) + "] " + (l.speaker || "") + " mentioned you: " + (l.translation || l.text || ""))); L.push(""); }
  const tot = realSpeakers(talkTotals()), whole = Object.values(tot).reduce((x, y) => x + y, 0) || 1;
  if (Object.keys(tot).length) { L.push("## Who spoke", ""); Object.entries(tot).sort((x, y) => y[1] - x[1]).forEach(([s, v]) => L.push("- " + s + ": " + (v / 60).toFixed(1) + " min (" + Math.round(v / whole * 100) + "%)")); L.push(""); }
  const em = a.follow_up_email || {};
  if (em.body) L.push("## Follow-up email (draft)", "", "**Subject:** " + (em.subject || ""), "", em.body, "");
  const turns = mergeTranscript(d.transcript);
  if (turns.length) { L.push("## Transcript", ""); turns.forEach(m => { L.push("**[" + stamp(m.t) + "] " + m.speaker + ":** " + m.text); if (m.translation) L.push("> In English: " + m.translation); L.push(""); }); }
  download(new Blob([L.join("\n")], { type: "text/markdown;charset=utf-8" }), safeName() + ".md"); showToast("Markdown downloaded");
}

async function exportDocx() {
  try {
    const { Document, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, Packer, ShadingType } = docx;
    const d = reportData, a = d.analysis || {};
    const P = (text, o) => new Paragraph(Object.assign({ text: String(text == null ? "" : text), spacing: { after: 100 } }, o || {}));
    const H = t => new Paragraph({ text: t, heading: HeadingLevel.HEADING_2, spacing: { before: 280, after: 100 } });
    const B = t => new Paragraph({ text: String(t), bullet: { level: 0 }, spacing: { after: 60 } });
    const cell = (t, bold, fill) => new TableCell({ shading: fill ? { type: ShadingType.CLEAR, fill } : undefined, children: [new Paragraph({ children: [new TextRun({ text: String(t || ""), bold: !!bold })] })] });
    const kids = [new Paragraph({ text: heading(), heading: HeadingLevel.HEADING_1 })];
    const facts = [prettyWhen(), (Number(d.duration_minutes) || 0).toFixed(0) + " min", d.platform, people().length ? "with " + people().join(", ") : ""].filter(Boolean);
    kids.push(new Paragraph({ children: [new TextRun({ text: facts.join("  ·  "), color: "64748B", size: 20 })], spacing: { after: 200 } }));
    if (briefText()) kids.push(new Paragraph({ shading: { type: ShadingType.CLEAR, fill: "EFF6FF" }, spacing: { before: 60, after: 200 }, children: [new TextRun({ text: "IN SHORT  ", bold: true, color: "2563EB", size: 18 }), new TextRun({ text: briefText(), size: 26 })] }));
    if ((a.decisions || []).length) { kids.push(H("Decisions")); a.decisions.forEach(x => kids.push(B("✓ " + x))); }
    if ((a.action_items || []).length) {
      kids.push(H("Action items"));
      const due = a.action_items.some(i => i.due);
      kids.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [
        new TableRow({ children: [cell("Task", true, "F1F5F9"), cell("Who", true, "F1F5F9")].concat(due ? [cell("When", true, "F1F5F9")] : []) }),
        ...a.action_items.map(i => new TableRow({ children: [cell(i.task), cell(i.owner || "-")].concat(due ? [cell(i.due || "-")] : []) })) ] }));
    }
    if (a.summary && norm(a.summary) !== norm(briefText())) kids.push(H("Context"), P(a.summary));
    const take = a.takeaways || a.key_points || [];
    if (take.length) { kids.push(H("Worth remembering")); take.forEach(x => kids.push(B(x))); }
    if ((a.open_questions || []).length) { kids.push(H("Still open")); a.open_questions.forEach(x => kids.push(B(x))); }
    if ((a.chapters || []).length) { kids.push(H("Timeline")); a.chapters.forEach(c => kids.push(new Paragraph({ bullet: { level: 0 }, children: [new TextRun({ text: (c.start || "") + "  " + (c.title || ""), bold: true }), new TextRun(c.summary ? " – " + c.summary : "")] }))); }
    const marks = d.bookmarks || [], men = (d.transcript || []).filter(l => l.mention);
    if (marks.length || men.length) { kids.push(H("Highlights")); marks.forEach(b => kids.push(B("★ " + stamp(b.t) + "  " + (bookmarkText(b) || "Bookmarked")))); men.forEach(l => kids.push(B("@ " + stamp(l.t) + "  " + (l.speaker || "") + " mentioned you: " + (l.translation || l.text || "")))); }
    const tot = realSpeakers(talkTotals()), whole = Object.values(tot).reduce((x, y) => x + y, 0) || 1;
    if (Object.keys(tot).length) {
      kids.push(H("Who spoke"));
      kids.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [new TableRow({ children: [cell("Speaker", true, "F1F5F9"), cell("Minutes", true, "F1F5F9"), cell("Share", true, "F1F5F9")] }),
        ...Object.entries(tot).sort((x, y) => y[1] - x[1]).map(([s, v]) => new TableRow({ children: [cell(s), cell((v / 60).toFixed(1)), cell(Math.round(v / whole * 100) + "%")] }))] }));
    }
    const em = a.follow_up_email || {};
    if (em.body) { kids.push(H("Follow-up email (draft)"), new Paragraph({ children: [new TextRun({ text: "Subject: " + (em.subject || ""), bold: true })] })); String(em.body).split("\n").forEach(l => kids.push(P(l))); }
    const turns = mergeTranscript(d.transcript);
    if (turns.length) {
      kids.push(new Paragraph({ text: "Full transcript", heading: HeadingLevel.HEADING_2, pageBreakBefore: true }));
      turns.forEach(m => {
        kids.push(new Paragraph({ spacing: { before: 100, after: 20 }, children: [new TextRun({ text: stamp(m.t) + "  ", color: "64748B", size: 18 }), new TextRun({ text: m.speaker + "  ", bold: true, color: "2563EB" }), new TextRun(m.text)] }));
        if (m.translation) kids.push(new Paragraph({ indent: { left: 500 }, children: [new TextRun({ text: "In English: ", bold: true, color: "64748B", size: 19 }), new TextRun({ text: m.translation, italics: true, color: "64748B", size: 20 })] }));
      });
    }
    download(await Packer.toBlob(new Document({ sections: [{ children: kids }] })), safeName() + ".docx"); showToast("DOCX downloaded");
  } catch (err) { console.error("DOCX export error:", err); showToast("Could not export DOCX: " + err.message); }
}
