name: Release

# Publish a version by pushing a tag:   git tag v0.3.0 && git push origin v0.3.0
# The tag must match `version` in pyproject.toml. This builds the package, creates a GitHub Release with the files
# attached, and (optionally) publishes to PyPI so people can run `uvx inkwake` without the GitHub URL.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        run: |
          python - <<'EOF'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == tag, f"tag v{tag} does not match pyproject version {version}"
          print("version", version)
          EOF
      - name: Build
        run: |
          python -m pip install build pillow
          python -m build
          python extension/build.py          # the browser extension, one zip per browser family
          cp extension/dist/*.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    # Only runs once you set the repository variable PUBLISH_TO_PYPI=true and add this repo as a "trusted publisher"
    # on pypi.org (no password or token is stored anywhere).
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
