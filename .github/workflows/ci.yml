name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Ink and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  install-from-github-check:
    name: Package contains the report page and logo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and inspect it
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("inkwake/assets/viewer.html", "inkwake/assets/ink.png", "inkwake/localserver.py"):
              assert need in names, f"missing from the wheel: {need}"
          print("wheel ok")
          EOF

  extension:
    name: Browser extension (tests and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no browser and no API key needed)
        working-directory: extension
        run: node --test --test-timeout=60000
      - name: Build the Chrome and Firefox packages
        run: |
          python -m pip install pillow
          python extension/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ink-extension
          path: extension/dist/*.zip

  worker:
    name: Report server builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check cloud/worker.js
      - name: Bundle the Worker (no deploy, no secrets needed)
        working-directory: cloud
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
