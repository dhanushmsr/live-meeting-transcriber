[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkwake"
version = "0.2.0"
description = "Ink: a meeting assistant that listens, captions, translates and writes the report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "google-genai>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "psutil>=5.9",
    "python-docx>=1.1",
    "matplotlib>=3.8",
    "mss>=9.0",
    "Pillow>=10.0",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.scripts]
inkwake = "inkwake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkwake"]
